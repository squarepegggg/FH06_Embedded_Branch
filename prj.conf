

# PCB
CONFIG_STATIC_INIT_GNU=y

# SPI and GPIO
CONFIG_GPIO=y
CONFIG_SPI=y

# Serial driver (needed by console subsystem); route output to RTT not UART
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Logging via RTT
CONFIG_LOG=y
CONFIG_RTT_CONSOLE=y


# Power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# System-level power management: lets the kernel actually enter the deep
# low-power idle state between events instead of sitting in WFI.
CONFIG_PM=y

# Tickless kernel — stops the ~100 Hz system tick when idle so the CPU is
# not woken every 10 ms. Required for CONFIG_PM to deliver real savings.
CONFIG_TICKLESS_KERNEL=y

# Clock low-power tweaks: use the 32 kHz crystal (LFXO) instead of the LFRC.
# LFXO is more accurate -> tighter BLE RX/TX windows -> less radio energy.
# NOTE: only enable if the PCB actually has the 32.768 kHz crystal populated.
# If the board uses the internal RC, leave this disabled.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# Enable the on-chip DC/DC buck regulator. Roughly halves active current for
# the radio and CPU.
# NOTE: only enable if the PCB has the DC/DC inductor populated on DCC.
# Without the inductor this MUST be left disabled or the chip will malfunction.
CONFIG_BOARD_ENABLE_DCDC=y

# Free the NFC antenna pins (P0.09 / P0.10) for use as GPIO and disable the
# always-on NFC field, saving ~0.5 µA continuously.
CONFIG_NFCT_PINS_AS_GPIOS=y

# BLE (GATT peripheral for web dashboard)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AccelDevice"

# Larger BLE buffers to avoid "Event buffer too small" / -12 / kernel panic
# RX buffer must fit max HCI event (2 + 255 = 257). Use ACL size >= 257 so BT_BUF_RX_SIZE >= 257.


# FPU for ML inference
CONFIG_FPU=y

# Stack
CONFIG_MAIN_STACK_SIZE=1024

# Disable MPU stack guard (nRF52832 has only 8 MPU regions)
CONFIG_HW_STACK_PROTECTION=n

# ADC (enabled for solar PCB overlay)
CONFIG_ADC=y
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y



