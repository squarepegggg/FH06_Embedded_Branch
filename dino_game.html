<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game – BLE Gesture Control</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --muted: #8b8fa3;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  .conn-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    margin-bottom: 24px;
    width: 100%;
    max-width: 640px;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.connected { background: var(--green); }
  .status-text { flex: 1; font-size: 0.9rem; color: var(--muted); }
  .status-text.connected { color: var(--green); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.disconnect {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .game-container {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    width: 100%;
    max-width: 640px;
    margin-bottom: 24px;
  }
  canvas {
    width: 100%;
    height: 200px;
    display: block;
    border-radius: 8px;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 640px;
    margin-bottom: 16px;
  }
  .score { font-size: 1.2rem; font-weight: 700; font-family: 'Consolas', monospace; }
  .gesture-status {
    font-size: 0.85rem;
    color: var(--muted);
    padding: 6px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .gesture-status.active {
    color: var(--accent);
    border-color: var(--accent);
  }

  .log {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 640px;
    max-height: 150px;
    overflow-y: auto;
    padding: 12px 16px;
    font-family: 'Consolas', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .log .entry { display: flex; gap: 10px; }
  .log .ts { color: #555; flex-shrink: 0; }
  .log .msg.conn { color: var(--green); }
  .log .msg.err { color: var(--red); }
  .log .msg.game { color: var(--accent); }
</style>
</head>
<body>

<h1>Dino Game</h1>
<p class="subtitle">Do "67" dance to jump | BLE controlled</p>

<div class="conn-bar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-text" id="statusText">Disconnected</span>
  <button id="btnConnect" onclick="connectBLE()">Connect</button>
  <button id="btnDisconnect" class="disconnect" onclick="disconnectBLE()" disabled>Disconnect</button>
</div>

<div class="info-bar">
  <div class="score">Score: <span id="score">0</span></div>
  <div class="gesture-status" id="gestureStatus">No gesture</div>
</div>

<div class="game-container">
  <canvas id="gameCanvas" width="608" height="200"></canvas>
</div>

<div class="log" id="log"></div>

<script>
// ── BLE UUIDs (same as dashboard) ──────────────────────────
const SERVICE_UUID = '12345678-1234-5678-1234-1234567890ab';
const CHAR_UUID    = '12345679-1234-5678-1234-1234567890ab';

// ei-v5: dance classes, alphabetical order from EI Studio (digits before letters).
const ACTIVITIES = ['67', 'dab', 'disco', 'floss', 'idle'];
const LATENCY_SENTINEL = 0xFFFFFFFF;

let device = null;
let characteristic = null;

// ── Logging ────────────────────────────────────────────────
function log(msg, cls = '') {
  const el = document.getElementById('log');
  const now = new Date().toLocaleTimeString('en-US', { hour12: false });
  el.innerHTML += `<div class="entry"><span class="ts">${now}</span><span class="msg ${cls}">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
}

// ── BLE notification handler ───────────────────────────────
function onNotification(event) {
  const value = event.target.value;
  if (value.byteLength < 17) return;

  const label       = value.getUint8(0);
  const inferenceUs = value.getUint32(7, true);
  const isPrediction = label < ACTIVITIES.length && inferenceUs !== LATENCY_SENTINEL;

  if (isPrediction) {
    const name = ACTIVITIES[label] || 'unknown';
    document.getElementById('gestureStatus').textContent = name;
    document.getElementById('gestureStatus').className =
      'gesture-status' + (label === 0 ? ' active' : '');

    // "67" (label 0) = jump
    if (label === 0) {
      triggerJump();
      log('67 detected → JUMP', 'game');
    }
  }
}

// ── BLE connect / disconnect ───────────────────────────────
async function connectBLE() {
  try {
    log('Scanning for AccelDevice…', 'conn');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'AccelDevice' }],
      optionalServices: [SERVICE_UUID],
    });

    device.addEventListener('gattserverdisconnected', () => {
      setConnected(false);
      log('Device disconnected', 'err');
    });

    log('Connecting to GATT server…', 'conn');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);

    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', onNotification);

    setConnected(true);
    log('Connected — do "67" to jump!', 'conn');
  } catch (err) {
    log(`Error: ${err.message}`, 'err');
  }
}

function disconnectBLE() {
  if (device && device.gatt.connected) device.gatt.disconnect();
  setConnected(false);
}

function setConnected(connected) {
  document.getElementById('statusDot').className = 'status-dot' + (connected ? ' connected' : '');
  const st = document.getElementById('statusText');
  st.textContent = connected ? 'Connected to AccelDevice' : 'Disconnected';
  st.className = 'status-text' + (connected ? ' connected' : '');
  document.getElementById('btnConnect').disabled = connected;
  document.getElementById('btnDisconnect').disabled = !connected;
}

// ── GAME ───────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width - 32;
  canvas.width = W * dpr;
  canvas.height = 200 * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = '200px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const GROUND_Y = 160;
const DINO_W = 30;
const DINO_H = 40;
const GRAVITY = 0.6;
const JUMP_VEL = -12;

let dinoX = 60;
let dinoY = GROUND_Y - DINO_H;
let velY = 0;
let isJumping = false;

let obstacles = [];
let frameCount = 0;
let score = 0;
let gameOver = false;
let gameSpeed = 3;

function triggerJump() {
  if (!isJumping && !gameOver) {
    // Scale jump strength with game speed so it stays fair
    velY = JUMP_VEL - (gameSpeed - 3) * 0.4;
    isJumping = true;
  }
  if (gameOver) {
    // restart
    obstacles = [];
    score = 0;
    gameOver = false;
    gameSpeed = 3;
    dinoY = GROUND_Y - DINO_H;
    velY = 0;
    isJumping = false;
    frameCount = 0;
    log('Game restarted', 'game');
  }
}

// Also allow spacebar for testing without BLE
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    triggerJump();
  }
});

function spawnObstacle() {
  const W = canvas.width / dpr;
  // Taller obstacles as score increases (max out around score 40)
  const baseH = 20 + Math.min(score * 0.5, 15);
  const h = baseH + Math.random() * 25;
  // Wider obstacles at higher scores
  const w = 18 + Math.min(Math.floor(score / 10) * 4, 16);
  obstacles.push({ x: W, y: GROUND_Y - h, w: w, h: h });
}

function update() {
  if (gameOver) return;

  // Dino physics
  velY += GRAVITY;
  dinoY += velY;
  if (dinoY >= GROUND_Y - DINO_H) {
    dinoY = GROUND_Y - DINO_H;
    velY = 0;
    isJumping = false;
  }

  // Obstacles — spawn faster as score climbs
  const spawnInterval = Math.max(35, 120 - score * 3);
  if (frameCount % spawnInterval === 0) {
    spawnObstacle();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= gameSpeed;
    if (obstacles[i].x + obstacles[i].w < 0) {
      obstacles.splice(i, 1);
      score++;
      document.getElementById('score').textContent = score;
    }
  }

  // Collision
  for (const obs of obstacles) {
    if (
      dinoX + DINO_W > obs.x &&
      dinoX < obs.x + obs.w &&
      dinoY + DINO_H > obs.y
    ) {
      gameOver = true;
      log(`Game over! Score: ${score}`, 'err');
    }
  }

  // Speed up every time you score (caps at 10)
  gameSpeed = 3 + Math.min(score * 0.25, 7);

  frameCount++;
}

function draw() {
  const W = canvas.width / dpr;
  const H = 200;
  ctx.clearRect(0, 0, W, H);

  // Ground
  ctx.strokeStyle = '#2a2d3a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();

  // Dino (simple rectangle)
  ctx.fillStyle = var_accent;
  ctx.fillRect(dinoX, dinoY, DINO_W, DINO_H);

  // Eye
  ctx.fillStyle = '#0f1117';
  ctx.fillRect(dinoX + 20, dinoY + 6, 5, 5);

  // Obstacles (cacti)
  ctx.fillStyle = '#22c55e';
  for (const obs of obstacles) {
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
  }

  // Game over text
  if (gameOver) {
    ctx.fillStyle = '#e1e4ed';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, 80);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#8b8fa3';
    ctx.fillText('Do "sixseven" or press Space to restart', W / 2, 105);
  }
}

const var_accent = '#6366f1';

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
